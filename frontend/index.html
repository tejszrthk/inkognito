<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkognito — System Diagnostic</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background:#0a0b0d; color:#fff; font-family:sans-serif;">
  <div id="diagnostic-overlay" style="position:fixed; top:20px; left:20px; z-index:9999; font-size:12px; color:#d4af37; opacity:0.8;">
    [SYSTEM CHECK] <span id="diag-status">Initializing...</span>
  </div>

  <div id="root">
     <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; gap:20px;">
        <div style="width:40px; height:40px; border:3px solid #d4af37; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite;"></div>
        <div style="color:#d4af37; font-weight:600; letter-spacing:2px;">INKOGNITO BOOTING...</div>
        <div id="error-fallback" style="color:#ff4444; font-size:14px; display:none; max-width:80%; text-align:center;"></div>
     </div>
  </div>

  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

  <script>
    window.onerror = function(m, u, l) {
        document.getElementById('diag-status').innerText = 'ERROR: ' + m;
        const fallback = document.getElementById('error-fallback');
        fallback.style.display = 'block';
        fallback.innerText = '⚠️ Javascript Error: ' + m + ' at line ' + l;
    };
    function checkReady() {
        if (window.React && window.ReactDOM && window.Babel) {
            document.getElementById('diag-status').innerText = 'Dependencies Ready. Rendering App...';
        } else {
            document.getElementById('diag-status').innerText = 'Waiting for dependencies...';
        }
    }
    setTimeout(checkReady, 2000);
  </script>

  <!-- Core Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <script src="https://unpkg.com/lucide@latest" crossorigin></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- API Service ---
    const api = {
        h: () => ({ 'Authorization': `Bearer ${localStorage.getItem('inkognito_token') || ''}`, 'Content-Type': 'application/json' }),
        req: (p, o = {}) => fetch(`/api${p}`, { ...o, headers: { ...api.h(), ...o.headers } }).then(r => r.json().then(d => r.ok ? d : Promise.reject(d.err || 'Err'))),
    };

    function Icon({ name, size = 18, color = "currentColor", className = "" }) {
        useEffect(() => { try { if (window.lucide) window.lucide.createIcons(); } catch(e) {} }, [name]);
        return <i data-lucide={name} className={className} style={{ width: size, height: size, color: color, display: 'inline-block' }}></i>;
    }

    function App() {
        const [user, setUser] = useState(null);
        const [view, setView] = useState('loading');
        const [jobId, setJobId] = useState('');
        const [rep, setRep] = useState(null);
        const [err, setErr] = useState('');

        useEffect(() => {
            const token = localStorage.getItem('inkognito_token');
            if (token) api.req('/user').then(u => { setUser(u); setView('dashboard'); }).catch(() => setView('auth'));
            else setView('auth');
            document.getElementById('diagnostic-overlay').style.display = 'none';
        }, []);

        const logout = () => { localStorage.removeItem('inkognito_token'); setUser(null); setView('auth'); };

        if (view === 'loading') return null; // Root fallback handles start loader

        return (
            <div className="app-container fade-in">
                <header style={{ marginBottom:'48px', borderBottom:'1px solid var(--border-subtle)', paddingBottom:'24px', display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                    <div onClick={() => user && setView('dashboard')} style={{ cursor:'pointer' }}>
                        <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
                            <Icon name="shield-check" color="var(--accent-gold)" size={24} />
                            <h1 className="serif-heading" style={{ fontSize:'1.8rem', color:'var(--accent-gold)', margin:0 }}>INKOGNITO v2</h1>
                        </div>
                        <p style={{ fontSize:'0.7rem', color:'var(--accent-gold)', fontWeight:600, marginTop:'4px', letterSpacing:'0.15em', margin:0 }}>PREMIUM PUBLIC RECORDS VERIFICATION</p>
                    </div>
                    {user && (
                        <div style={{ display:'flex', alignItems:'center', gap:'20px' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:'8px', background:'var(--bg-panel)', padding:'8px 16px', borderRadius:'10px', border:'1px solid var(--border-subtle)' }}>
                                <Icon name="user" size={14} color="var(--accent-gold)" />
                                <span style={{ fontSize:'0.8rem', fontWeight:600 }}>{user.username.toUpperCase()}</span>
                            </div>
                            <button className="btn btn-outline" style={{ padding:'8px 16px', fontSize:'0.75rem' }} onClick={logout}>LOGOUT</button>
                        </div>
                    )}
                </header>

                <main>
                    {view === 'auth' && (
                        <div style={{ display:'flex', justifyContent:'center', paddingTop:'40px' }}>
                            <div className="panel" style={{ width:'100%', maxWidth:'400px', textAlign:'center' }}>
                                <h2 className="serif-heading" style={{ marginBottom:'32px' }}>Authentication</h2>
                                <form onSubmit={e => { e.preventDefault(); api.req('/login', { method:'POST', body:JSON.stringify({username:e.target.u.value, password:e.target.p.value}) }).then(d => { localStorage.setItem('inkognito_token', d.token); setUser(d.user); setView('dashboard'); }).catch(e => setErr(e)); }}>
                                    <div style={{ marginBottom:'16px', textAlign:'left' }}><label className="input-label">Username</label><input name="u" required /></div>
                                    <div style={{ marginBottom:'24px', textAlign:'left' }}><label className="input-label">Password</label><input name="p" type="password" required /></div>
                                    <button className="btn btn-primary" style={{ width:'100%' }}>LOG IN</button>
                                </form>
                                {err && <div style={{ color:'#ff4444', marginTop:'20px' }}>{err}</div>}
                            </div>
                        </div>
                    )}

                    {view === 'dashboard' && (
                        <div className="fade-in">
                            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'40px' }}>
                                <h2 className="serif-heading" style={{ fontSize:'2rem' }}>Archival Hub</h2>
                                <button className="btn btn-primary" onClick={() => setView('intake')}><Icon name="plus" /> NEW</button>
                            </div>
                            <DashboardList onSelect={r => api.req(`/jobs/report-${r.report_id}`).then(d => { setRep(d.report); setView('report'); })} />
                        </div>
                    )}

                    {view === 'intake' && (
                        <div className="fade-in">
                            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'32px' }}>
                                <h2 className="serif-heading">New Verification</h2>
                                <button className="btn btn-outline" onClick={() => setView('dashboard')}>CANCEL</button>
                            </div>
                            <div className="panel">
                                <form onSubmit={e => { e.preventDefault(); api.req('/run', { method:'POST', body:JSON.stringify({name:e.target.name.value, phone:e.target.phone.value, city:e.target.city.value}) }).then(d => { setJobId(d.job_id); setView('pipeline'); }).catch(e => setErr(e)); }}>
                                    <div style={{ display:'grid', gap:'20px' }}>
                                        <div><label className="input-label">Full Name</label><input name="name" required /></div>
                                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'20px' }}>
                                            <div><label className="input-label">Phone</label><input name="phone" required /></div>
                                            <div><label className="input-label">City</label><input name="city" required /></div>
                                        </div>
                                        <button className="btn btn-primary" style={{ padding:'18px' }}>START PIPELINE</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {view === 'pipeline' && <PipelineTracker jobId={jobId} onComplete={r => { setRep(r); setView('report'); }} />}
                    
                    {view === 'report' && (
                        <div className="fade-in">
                            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'40px' }}>
                                <h1 className="serif-heading">{rep.subject_name}</h1>
                                <button className="btn btn-outline" onClick={() => setView('dashboard')}>CLOSE</button>
                            </div>
                            {Object.entries(rep.modules_run || {}).map(([k, m]) => m.ran && (
                                <div key={k} className="panel" style={{ marginBottom:'20px' }}>
                                    <h4 style={{ color:'var(--accent-gold)' }}>{k.toUpperCase()}</h4>
                                    {m.findings?.map((f, i) => (
                                        <div key={i} style={{ padding:'12px', background:'var(--bg-input)', marginTop:'10px', borderRadius:'8px' }}>
                                            <b>{f.title}</b>: {f.detail}
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>
                    )}
                </main>
            </div>
        );
    }

    function DashboardList({ onSelect }) {
        const [reps, setReps] = useState([]);
        useEffect(() => { api.req('/reports').then(setReps); }, []);
        return (
            <div style={{ display:'grid', gap:'10px' }}>
                {reps.length === 0 ? <div className="panel" style={{ textAlign:'center' }}>No reports yet.</div> :
                 reps.map(r => (
                    <div key={r.report_id} className="panel" style={{ cursor:'pointer', display:'flex', justifyContent:'space-between' }} onClick={() => onSelect(r)}>
                        <span>{r.subject_name}</span>
                        <Icon name="chevron-right" />
                    </div>
                 ))
                }
            </div>
        );
    }

    function PipelineTracker({ jobId, onComplete }) {
        const [job, setJob] = useState(null);
        useEffect(() => {
            const tk = setInterval(() => {
                api.req(`/jobs/${jobId}`).then(d => { setJob(d); if (d.status === 'completed') { clearInterval(tk); onComplete(d.report); } });
            }, 3000);
            return () => clearInterval(tk);
        }, [jobId]);
        return (
            <div style={{ textAlign:'center', paddingTop:'40px' }}>
                <Icon name="loader-2" className="spin" size={48} color="var(--accent-gold)" />
                <h2 className="serif-heading">Scanning Records...</h2>
                <div style={{ marginTop:'20px', maxWidth:'400px', margin:'20px auto' }}>
                    {job?.modules?.map(m => (
                        <div key={m.name} style={{ display:'flex', justifyContent:'space-between', opacity: m.status==='queued'?0.4:1 }}>
                            <span>{m.name}</span>
                            <span>{m.status}</span>
                        </div>
                    ))}
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
